<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recon Pasivo — Subdominios / IPs / Shodan</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #4f8cff;
    --ok: #3fbf6f;
    --err: #ff5a5a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { color: var(--muted); margin-top: 0; font-size: 0.9rem; }
  .search-box {
    display: flex;
    gap: 10px;
    margin: 24px 0;
  }
  input[type="text"] {
    flex: 1;
    padding: 14px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); }
  button {
    padding: 14px 22px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 1rem;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .notice {
    background: #201a10;
    border: 1px solid #4a3a12;
    color: #e0b862;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  #status { color: var(--muted); margin-bottom: 16px; font-size: 0.9rem; }
  .summary {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }
  .summary div {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .summary strong { display: block; color: var(--text); font-size: 1.3rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .subdomain { font-weight: 600; word-break: break-all; }
  .ip {
    font-family: 'Consolas', monospace;
    color: var(--accent);
    background: #10233c;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.85rem;
  }
  .ip.none { color: var(--muted); background: transparent; }
  .shodan-block { margin-top: 10px; font-size: 0.85rem; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge.ok { background: #0f3322; color: var(--ok); }
  .badge.err { background: #331313; color: var(--err); }
  table.ports { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem; }
  table.ports th, table.ports td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
  }
  table.ports th { color: var(--text); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Cartoneando la Red</h1>

  <div class="notice">
 Esta herramienta no es un scanner de vulnerabilidades, busca escaneos previos en internet de libre acceso sin usar apikey ni otro servicio pago
  </div>

  <div class="search-box">
    <input type="text" id="target" placeholder="ejemplo.com" autocomplete="off">
    <button id="scanBtn">Escanear</button>
  </div>

  <div id="status"></div>
  <div id="summary" class="summary" style="display:none;"></div>
  <div id="results"></div>
</div>

<script>
const targetInput = document.getElementById('target');
const scanBtn = document.getElementById('scanBtn');
const statusEl = document.getElementById('status');
const summaryEl = document.getElementById('summary');
const resultsEl = document.getElementById('results');

async function runScan() {
  const target = targetInput.value.trim();
  if (!target) {
    statusEl.textContent = 'Ingresá un dominio primero.';
    return;
  }

  scanBtn.disabled = true;
  resultsEl.innerHTML = '';
  summaryEl.style.display = 'none';
  statusEl.textContent = 'Escaneando... esto puede tardar según la cantidad de subdominios encontrados.';

  try {
    const resp = await fetch('/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target })
    });
    const data = await resp.json();

    if (!resp.ok) {
      statusEl.textContent = 'Error: ' + (data.error || 'desconocido');
      return;
    }

    statusEl.textContent = '';
    renderSummary(data);
    renderResults(data.resultados);
  } catch (err) {
    statusEl.textContent = 'Error de red: ' + err.message;
  } finally {
    scanBtn.disabled = false;
  }
}

function renderSummary(data) {
  summaryEl.style.display = 'flex';
  const total = data.total_subdominios_encontrados;
  summaryEl.innerHTML = `
    <div><strong>${data.dominio}</strong> objetivo</div>
    ${total !== null && total !== undefined ? `<div><strong>${total}</strong> subdominios encontrados</div>` : ''}
  `;
}


function renderResults(resultados) {
  if (!resultados || resultados.length === 0) {
    resultsEl.innerHTML = '<p style="color:var(--muted)">No se encontraron subdominios.</p>';
    return;
  }

  resultsEl.innerHTML = resultados.map(r => {
    const ipHtml = r.ip ? `<span class="ip">${r.ip}</span>` : `<span class="ip none">sin resolución DNS</span>`;
    const nombre = r.subdominio || r.ip || '';

    let shodanHtml = '';

    if (r.shodan) {
      if (r.shodan.ok) {
        const puertosRows = (r.shodan.puertos || []).map(p =>
          `<tr><td>${p.puerto}</td><td>${p.servicio}</td></tr>`
        ).join('');
        const tabla = (r.shodan.puertos && r.shodan.puertos.length)
          ? `<table class="ports"><thead><tr><th>Puerto</th><th>Servicio</th></tr></thead><tbody>${puertosRows}</tbody></table>`
          : '<div style="color:var(--muted); margin-top:6px;">Sin puertos listados públicamente.</div>';

        shodanHtml = `
          <div class="shodan-block">
            <span class="badge ok">Shodan OK</span>

            ${r.shodan.url ? `<a href="${r.shodan.url}" target="_blank" rel="noopener">${r.shodan.url}</a>` : ''}

            <br><br>

            ${r.google ? `<a href="${r.google}" target="_blank" rel="noopener">Google</a>` : ''}

            <br><br>

            ${r.weymachine ? `<a href="${r.weymachine}" target="_blank" rel="noopener">WayMachine</a>` : ''}
            <br><br>
            ${r.tecnologia ? `<a href="${r.tecnologia}" target="_blank" rel="noopener">Tecnología detectada</a>` : ''}
            <br><br>
            ${r.shodan.captura ? `<img src="${r.shodan.captura}" alt="captura shodan" style="max-width:100%; margin-top:8px; border-radius:6px;">` : ''}

            ${tabla || ''}
          </div>`;
      } else {
        shodanHtml = `
          <div class="shodan-block">
            <span class="badge err">Shodan sin datos</span>
            ${r.shodan.error ? `<div style="color:var(--muted); margin-top:6px;">${r.shodan.error}</div>` : ''}
          </div>`;
      }
    }

    return `<div class="card"><div class="card-header"><span class="subdomain">${nombre}</span>${ipHtml}</div>${shodanHtml}</div>`;
  }).join('');
}

scanBtn.addEventListener('click', runScan);
targetInput.addEventListener('keydown', e => { if (e.key === 'Enter') runScan(); });
</script>
</body>
</html>
